name: Supabase Database CI
on: [push, pull_request]

jobs:
  database-tests:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_URL: https://wizyuwbezyltaxatkupc.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: 
      SUPABASE_ANON_KEY: 

    steps:
    - uses: actions/checkout@v3

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Verify Supabase Connection
      run: |
        supabase status
        supabase db version

    - name: Run Database Migrations
      run: |
        supabase db push

    - name: Run Database Tests
      run: |
        # Add your database test commands here
        # Example: psql connection or custom test script
        psql "" -c "SELECT version();"

    # Optional: Lint database schema
    - name: Database Schema Lint
      run: |
        supabase db lint
